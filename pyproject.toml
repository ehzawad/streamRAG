[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamrag"
version = "0.1.0"
description = "Naive RAG vs StreamRAG for typed input"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.139.2",
  "uvicorn[standard]==0.51.0",
  "openai==2.46.0",
  "pydantic-ai-slim[openai]==2.15.0",
  "qdrant-client==1.18.0",
  "numpy==2.5.1",
  "pydantic==2.13.4",
  "python-dotenv==1.2.2",
  "tiktoken==0.13.0",
  "aiosqlite==0.22.1",
  "sse-starlette==3.4.6",
  "httpx==0.28.1",
]

[dependency-groups]
dev = [
  "ruff==0.15.22",
]

[tool.setuptools.packages.find]
include = ["shared*", "naive*", "stream*", "comparison*"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
